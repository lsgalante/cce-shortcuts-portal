[package]
name = "cce-shortcuts-portal"
version = "0.1.0"
edition = "2021"
description = "org.freedesktop.impl.portal.GlobalShortcuts backend for the cce compositor"
license = "GPL-3.0-only"

[dependencies]
# The compositor's socket names, the shortcut request lines and the
# `shortcuts` topic's event line (ipc::ctl); GUI-free, without the config.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
log = "0.4"
env_logger = "0.11"
